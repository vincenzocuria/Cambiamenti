<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-cambia-menti.png" />
    <link rel="apple-touch-icon" href="/logo-cambia-menti.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applica il tema salvato prima del disegno della pagina, per non vedere un lampo bianco (vedi src/lib/theme.ts).
      (function () {
        var c = 'auto'
        try { c = localStorage.getItem('cm.theme') || 'auto' } catch (e) {}
        if (c !== 'light' && c !== 'soft' && c !== 'dark')
          c = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = c
      })()
    </script>
    <title>Cambia-Menti Formazione — Gestionale</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
